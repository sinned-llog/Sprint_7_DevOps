services:
  api:
    image: datascientest/fastapi:1.0.0
    container_name: api
    ports:
      - "8000:8000"
    networks:
      - my_network

  authentication_test:
    build:
      context: .
      dockerfile: Dockerfile.authentication
    image: authentication_test_container:latest
    container_name: authentication_test
    environment:
      - API_ADDRESS=api
      - API_PORT=8000
      - LOG=1
    networks:
      - my_network
    volumes:
      - ./logs:/logs
    depends_on:
      - api

  authorization_test:
    build:
      context: .
      dockerfile: Dockerfile.authorization
    image: authorization_test_container:latest
    container_name: authorization_test
    environment:
      - API_ADDRESS=api
      - API_PORT=8000
      - LOG=1
    networks:
      - my_network
    volumes:
      - ./logs:/logs
    depends_on:
      - api
      - authentication_test

  content_test:
    build:
      context: .
      dockerfile: Dockerfile.content
    image: content_test_container:latest
    container_name: content_test
    environment:
      - API_ADDRESS=api
      - API_PORT=8000
      - LOG=1
    networks:
      - my_network
    volumes:
      - ./logs:/logs
    depends_on:
      - api
      - authentication_test
      - authorization_test
      
networks:
  my_network:
    driver: bridge